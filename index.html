<!-- ============================================================
     COGNITO EMBED FIXES
     Three things the wrapper page has to do that Cognito can't:
     (1) the validation color, (2) radio-row vertical alignment,
     (3) dropping the period from "or drag files here."

     Why a script and not CSS: the form carries
     cog-cognito--protect-css, Cognito's style-isolation mode.
     A stylesheet rule on .cog-cognito is ignored — verified live
     8/7/26. Setting properties inline on the elements beats the
     isolation. This is the only method that works.

     --negative drives ALL of: the required-field asterisk, the
     field outline, the error message bar, and a pale wash behind
     the field in its error state.
     --negative-reverse is the text color on top of the bar.

     #A300A9 measures 5.4:1 on white — clears the 4.5:1 AA floor,
     which matters for the asterisk and label. Chosen 8/7/26 over
     #d700ea (4.2:1, under AA) and deliberately kept clear of the
     brand purple #5a00bc so the brand color is never the error
     color.

     ⚠️ Cognito's Highlight color (Publish > Form Styles) was set
     to match by hand. They are separate settings — change one and
     the checked-radio color drifts from the error color.

     The form renders asynchronously and re-renders during use, so
     this runs on a MutationObserver that stays connected for the
     life of the page. Every write is guarded, so re-running is
     cheap. See the note above the observer for why it does not
     disconnect.
     ============================================================ -->
<script>
(function () {
  var NEGATIVE = '#A300A9';
  var REVERSE  = '#FFFFFF';

  function paint() {
    var form = document.querySelector('.cog-cognito');
    if (!form) return false;
    if (form.style.getPropertyValue('--negative') !== NEGATIVE) {
      form.style.setProperty('--negative', NEGATIVE, 'important');
      form.style.setProperty('--negative-reverse', REVERSE, 'important');
    }
    stripDragTextPeriod(form);
    return alignInlineRadios(form);
  }

  /* ---- Upload prompt punctuation -------------------------------
     Cognito's file-upload fields render "or drag files here." —
     a trailing period on a fragment that sits beside an Upload
     button. Dropped for consistency with the other field prompts.

     Three instances: Cover Letter, Résumé, Writing Sample.

     ⚠️ This edits rendered text, NOT Cognito's documented text
     override API:
     cognitoforms.com/support/24/building-forms/override-default-text-values
     Fine for deleting one character. If these strings ever need
     real rewording, use the API instead — it survives re-renders
     by design, this does not.

     Runs on every observer tick rather than once, in case Cognito
     re-renders an upload field (it does after a file is attached).
     -------------------------------------------------------------- */
  function stripDragTextPeriod(form) {
    form.querySelectorAll('.cog-upload__drag-text').forEach(function (el) {
      var t = el.textContent.replace(/\.\s*$/, '');
      if (t !== el.textContent) el.textContent = t;
    });
  }

  /* ---- Radio-row vertical alignment ----------------------------
     Cognito renders a radio group that shares a row with another
     field flush to the TOP of the row, so its buttons sit level
     with the neighbouring field's LABEL rather than its input box.
     Visible on "Hours Available" — the Weekly/Monthly pair floated
     above the number box.

     ⚠️ BOTH properties are required. Verified live 8/7/26:
       - margin-top alone does nothing. The fieldset stretches to
         the row's full height, so shrinking it just lets the
         content re-centre itself — net zero movement.
       - align-items:center alone does nothing either, for the
         same reason: a stretched box is already "centred".
       - Together they work. Centring stops the stretch, and the
         margin then actually displaces the box.
     Removing either one silently undoes the fix.

     Only radio groups with a HIDDEN label need this. A visible
     label already pushes its buttons down by its own height, and
     nudging those would misalign them. Cognito marks a hidden one
     with cog-offscreen on the <legend>, which is what this tests —
     deliberately NOT the generated cog-field--124 class, which is
     tied to field ID and changes if the form is rebuilt. Confirmed
     to match exactly 1 fieldset: Weekly/Monthly, not Yes/No.

     1.6rem lines the buttons up with the input box. Retune if the
     label font size changes.
     -------------------------------------------------------------- */
  function alignInlineRadios(form) {
    var done = false;
    form.querySelectorAll('.cog-choice--radiobuttons').forEach(function (fs) {
      var legend = fs.querySelector('legend.cog-offscreen');
      if (!legend) return;
      var row = fs.closest('.cog-row');
      if (!row || row.children.length < 2) return;  // alone in its row
      if (fs.style.marginTop !== '1.6rem') {
        row.style.setProperty('align-items', 'center', 'important');
        fs.style.setProperty('margin-top', '1.6rem', 'important');
      }
      done = true;
    });
    return done;
  }

  paint();

  /* The observer intentionally does NOT disconnect. Cognito
     re-renders parts of the form during use — attaching a file
     rebuilds the upload field, which restores the period we just
     removed. A one-shot observer would leave those re-renders
     unpatched. paint() is only a handful of querySelectorAll calls
     and every write is guarded, so re-running it is cheap. */
  new MutationObserver(function () { paint(); })
    .observe(document.body, { childList: true, subtree: true });
})();
</script>
