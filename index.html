<style>
  :root {
    --brand-lavender: #E4DCFB;
    --brand-purple:   #5a00bc;
    --ink:            #1A1A2E;
    --page-bg:        #F7F5FC;
    --panel:          #FFFFFF;
    --rule:           #E2DEF0;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ---- Optional background video -------------------------------
     Drop bg.mp4 + bg.webm in the repo root and delete the
     display:none rule to switch this on. Encoding specs are in
     the migration checklist. Hidden on mobile by the media query
     at the bottom of this stylesheet.
     -------------------------------------------------------------- */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    display: none;
  }

  /* ---- Mobile-only logo ----------------------------------------
     The background video carries Goaloop's branding on desktop.
     Video is gated out below 768px, so the logo takes its place
     there and only there. The form's own header supplies the
     page title on both.
     -------------------------------------------------------------- */
  header.site {
    display: none;
    background: var(--brand-lavender);
    padding: 1.5rem 1.25rem;
    text-align: center;
    border-bottom: 1px solid var(--rule);
  }

  header.site img.logo {
    max-width: 220px;
    height: auto;
    margin: 0 auto;
    display: block;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1.75rem 1.5rem;
  }

  footer.site {
    text-align: center;
    padding: 2rem 1.25rem 3rem;
    font-size: .82rem;
    opacity: .7;
  }

  footer.site a { color: var(--brand-purple); }

  footer.site p { margin: .3rem 0; }

  /* ---- Cognito Forms overrides ---------------------------------
     Cognito exposes no error-color control in its UI, so the
     validation palette is set here. --negative drives error
     messages, the required asterisk, and the focus highlight.
     --negative-reverse is the text color that sits on top of it.

     ⚠️ #03f1ee is the TEST value chosen 8/6/26, not a final
     brand color. Swap both values and re-check readability by
     submitting the form with Name left blank.
     -------------------------------------------------------------- */
  .cog-cognito {
    --negative:         #03f1ee;
    --negative-reverse: #003331;
    --font-family: "Open Sans", sans-serif;
  }

  /* Hidden from sight, present for search engines and screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Accessibility floor */
  a:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--brand-purple);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 768px) {
    #bg { display: none !important; }
    header.site { display: block; }
    main { padding: 1.25rem .85rem 3rem; }
    .panel { padding: 1.1rem .85rem; border-radius: 8px; }
  }
</style>
</head>
