<style>
  :root {
    --brand-lavender: #E4DCFB;   /* unused since 8/7/26 — header is white so the
                                    master logo sits on white. Kept: brand color. */
    --brand-purple:   #5a00bc;
    --ink:            #1A1A2E;
    --page-bg:        #F7F5FC;
    --panel:          #FFFFFF;
    --rule:           #E2DEF0;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ---- Optional background video -------------------------------
     Drop bg.mp4 + bg.webm in the repo root and delete the
     display:none rule to switch this on. Encoding specs are in
     the migration checklist. Hidden on mobile by the media query
     at the bottom of this stylesheet.
     -------------------------------------------------------------- */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    display: none;
  }

  /* ---- Mobile-only logo ----------------------------------------
     The background video carries Goaloop's branding on desktop.
     Video is gated out below 768px, so the logo takes its place
     there and only there. The form's own header supplies the
     page title on both.
     -------------------------------------------------------------- */
  header.site {
    display: none;
    background: #FFFFFF;
    padding: 1.5rem 1.25rem;
    text-align: center;
    border-bottom: 1px solid var(--rule);
  }

  header.site img.logo {
    max-width: 220px;
    height: auto;
    margin: 0 auto;
    display: block;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1.75rem 1.5rem;
  }

  footer.site {
    text-align: center;
    padding: 2rem 1.25rem 3rem;
    font-size: .82rem;
    opacity: .7;
  }

  footer.site a { color: var(--brand-purple); }

  footer.site p { margin: .3rem 0; }

  /* Hidden from sight, present for search engines and screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Accessibility floor */
  a:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--brand-purple);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 768px) {
    #bg { display: none !important; }
    header.site { display: block; }
    main { padding: 1.25rem .85rem 3rem; }
    .panel { padding: 1.1rem .85rem; border-radius: 8px; }
  }
</style>
</head>

<!-- ============================================================
     COGNITO EMBED FIXES
     Two things the wrapper page still has to do that Cognito's
     own settings can't: (1) the validation color, (2) radio-row
     vertical alignment.

     How this works NOW (Iframe embed, since 8/13/26):
     the form lives in a cross-origin iframe, so this page cannot
     touch its DOM at all. Styles are handed to Cognito's own
     iframe.js via Cognito.setCss(), which injects them INSIDE the
     frame. Verified live 8/13/26 — both rules apply.

     Superseded: under the old Seamless embed this was a script
     that wrote inline styles and re-ran on a MutationObserver,
     because a stylesheet rule on .cog-cognito was ignored by
     cog-cognito--protect-css. None of that applies anymore.
     setCss() reaches inside the isolation on its own.

     Also lost in that switch, deliberately: the period was being
     stripped from Cognito's "or drag files here." upload prompt
     on three fields. That was a text edit, not a style, and CSS
     cannot do it from outside the frame. Recover through
     Cognito's text-override setting if it ever matters.

     --negative drives ALL of: the required-field asterisk, the
     field outline, the error message bar, and a pale wash behind
     the field in its error state.
     --negative-reverse is the text color on top of the bar.

     #A300A9 measures 5.4:1 on white — clears the 4.5:1 AA floor,
     which matters for the asterisk and label. Chosen 8/7/26 over
     #d700ea (4.2:1, under AA) and deliberately kept clear of the
     brand purple #5a00bc so the brand color is never the error
     color.

     ⚠️ Cognito's Highlight color (Publish > Form Styles) was set
     to match by hand. They are separate settings — change one and
     the checked-radio color drifts from the error color.
     ============================================================ -->
<script>
/* ---- Cognito iframe styling ----------------------------------
   The Seamless embed let us reach into the form's DOM directly.
   The Iframe embed does not, so everything below is injected
   INTO the frame with Cognito.setCss().

   Verified live 8/13/26:
     - setCss() does penetrate cog-cognito--protect-css
     - :has() correctly isolates the Hours Available row

   ⚠️ LOST in the switch: the trailing period on Cognito's
   "or drag files here." upload prompt (Cover Letter, Résumé,
   Writing Sample). That was a text edit, not a style, and CSS
   cannot do it. Recover via Cognito's text-override setting:
   cognitoforms.com/support/24/building-forms/override-default-text-values
   -------------------------------------------------------------- */
if (window.Cognito && typeof Cognito.setCss === "function") {
  Cognito.setCss(`
  /* Error color — #A300A9 chosen for AA contrast (5.4:1).
     Brand purple #5a00bc is deliberately NOT used for errors. */
  .cog-cognito {
    --negative: #A300A9 !important;
    --negative-reverse: #FFFFFF !important;
  }

  /* Radio-row vertical alignment.
     Cognito floats a radio group flush to the TOP of a shared row,
     level with the neighbouring field's LABEL instead of its input.
     BOTH rules are required — verified 8/7/26 under the Seamless
     embed. Either one alone does nothing: the fieldset stretches to
     the row's full height, so centring alone is a no-op and margin
     alone just lets the content re-centre itself.

     Guards, matching the old JS exactly:
       - legend.cog-offscreen  = hidden label only. A visible label
         already pushes its buttons down by its own height.
       - :nth-child(2)         = fieldset shares the row. Alone in
         its row, it needs no nudge.
     Deliberately NOT keyed to cog-field--124, which is tied to
     field ID and changes if the form is rebuilt. */
  .cog-row:has(> :nth-child(2)):has(.cog-choice--radiobuttons legend.cog-offscreen) {
    align-items: center !important;
  }
  .cog-choice--radiobuttons:has(legend.cog-offscreen) {
    margin-top: 1.6rem !important;
  }
`);
}
</script>
